<!DOCTYPE html>
<html>
	<head>
		<title>three.js css3d - periodic table</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js css3d - periodic table">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/css3d_periodictable.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/css3d_periodictable.jpg">
		<script src="https://accounts.google.com/gsi/client" async defer></script>
		<style>
			body {
				background-color: #000;
				color: #fff;
				margin: 0px;
				overflow: hidden;
				font-family: Helvetica, Arial, sans-serif;
			}

			a {
				color: #8ff;
			}

			#info {
				position: absolute;
				top: 0px;
				width: 100%;
				padding: 10px;
				box-sizing: border-box;
				text-align: center;
				-webkit-user-select: none;
				user-select: none;
			}

			#menu {
				position: absolute;
				bottom: 20px;
				width: 100%;
				text-align: center;
			}

			.element {
				width: 130px;
				height: 170px;
				box-shadow: 0px 0px 12px rgba(0,255,255,0.5);
				border: 1px solid rgba(127,255,255,0.25);
				font-family: Helvetica, sans-serif;
				text-align: center;
				line-height: normal;
				cursor: default;
				overflow: hidden;
				position: relative;
			}

			.element .photo {
				position: absolute;
				top: 0px;
				left: 0px;
				width: 100%;
				height: 90px;
				object-fit: cover;
			}

			.element:hover {
				box-shadow: 0px 0px 12px rgba(0,255,255,0.75);
				border: 1px solid rgba(127,255,255,0.75);
			}

				.element .number {
					position: absolute;
					top: 20px;
					right: 20px;
					font-size: 12px;
					color: rgba(127,255,255,0.75);
				}

				.element .symbol {
					position: absolute;
					top: 92px;
					left: 4px;
					right: 4px;
					font-size: 13px;
					font-weight: bold;
					color: #fff;
					line-height: 1.15;
					text-shadow: 0 0 6px rgba(0,0,0,0.8);
				}

				.element .details {
					position: absolute;
					bottom: 4px;
					left: 4px;
					right: 4px;
					font-size: 10px;
					color: rgba(255,255,255,0.9);
					line-height: 1.2;
				}

			button {
				color: rgba(127,255,255,0.75);
				background: transparent;
				outline: 1px solid rgba(127,255,255,0.75);
				border: 0px;
				padding: 5px 10px;
				cursor: pointer;
			}

			button:hover {
				background-color: rgba(0,255,255,0.5);
			}

			button:active {
				color: #000000;
				background-color: rgba(0,255,255,0.75);
			}
		</style>
	</head>
	<body>
		<div id="login-screen" style="position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; z-index:100;">
			<div style="border:1px solid rgba(127,255,255,0.3); box-shadow:0 0 24px rgba(0,255,255,0.15); padding:40px 48px; text-align:center; max-width:360px;">
				<h1 style="font-size:20px; margin:0 0 8px; color:#8ff;">Welcome</h1>
				<p style="font-size:13px; color:#999; margin:0 0 24px; line-height:1.5;">Sign in with Google to view the dataset.</p>
				<button id="google-signin-btn" style="background:#4285F4; color:#fff; border:none; border-radius:4px; padding:10px 20px; font-size:14px; cursor:pointer;">Sign in with Google</button>
			</div>
		</div>
		<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> css3d - periodic table.</div>
		<div id="container"></div>
		<div id="menu">
			<button id="table">TABLE</button>
			<button id="sphere">SPHERE</button>
			<button id="helix">HELIX</button>
			<button id="grid">GRID</button>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import TWEEN from 'three/addons/libs/tween.module.js';
			import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
			import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

			const SHEET_ID = '19PgYxnUBtzUKytRLtKXnsKs5x2KqsxYV6bTE3StLkY8';
			const API_KEY = 'AIzaSyAkrjfuVQ58m1xwAu0ojY6trMXLc2264vA'; 
			const RANGE = 'Sheet1!A1:F201';

			let camera, scene, renderer;
			let controls;

			const objects = [];
			const targets = { table: [], sphere: [], helix: [], grid: [] };

			function loadDataAndStart() {

				fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`)
					.then( res => res.json() )
					.then( json => {

						const rows = json.values;
						const [ header, ...dataRows ] = rows;

						const people = dataRows.map( row => ( {
							name: row[0] || '',
							photo: row[1] || '',
							age: row[2] || '',
							country: row[3] || '',
							interest: row[4] || '',
							netWorth: row[5] || '$0'
						} ) );

						init( people );
						animate();

					} )
					.catch( err => {
						console.error( 'Failed to load sheet data:', err );
					} );

			}

			document.getElementById( 'google-signin-btn' ).addEventListener( 'click', function () {

				google.accounts.oauth2.initTokenClient( {
					client_id: '290678167271-gn4418qvkklr84kuckfpdm8gke5q96cl.apps.googleusercontent.com',
					scope: 'https://www.googleapis.com/auth/userinfo.email',
					callback: function ( tokenResponse ) {

						if ( tokenResponse.error ) {
							console.error( 'Sign-in failed:', tokenResponse.error );
							return;
						}

						document.getElementById( 'login-screen' ).style.display = 'none';
						loadDataAndStart();

					}
				} ).requestAccessToken();

			} );

			function parseNetWorth( str ) {
				return parseFloat( String( str ).replace( /[$,]/g, '' ) ) || 0;
			}

			function colorForNetWorth( str ) {
				const value = parseNetWorth( str );
				if ( value < 100000 ) return 'rgba(220,60,60,0.85)';
				if ( value <= 200000 ) return 'rgba(240,160,40,0.85)';
				return 'rgba(60,190,100,0.85)';
			}

			function init( people ) {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.z = 3000;

				scene = new THREE.Scene();

				// table	

				for ( let i = 0; i < people.length; i ++ ) {

					const person = people[ i ];

					const element = document.createElement( 'div' );
					element.className = 'element';
					element.style.backgroundColor = colorForNetWorth( person.netWorth );

					const photo = document.createElement( 'img' );
					photo.className = 'photo';
					photo.src = person.photo;
					element.appendChild( photo );

					const symbol = document.createElement( 'div' );
					symbol.className = 'symbol';
					symbol.textContent = person.name;
					element.appendChild( symbol );

					const details = document.createElement( 'div' );
					details.className = 'details';
					details.innerHTML = person.interest + '<br>' + person.netWorth;
					element.appendChild( details );

					const objectCSS = new CSS3DObject( element );
					objectCSS.position.x = Math.random() * 4000 - 2000;
					objectCSS.position.y = Math.random() * 4000 - 2000;
					objectCSS.position.z = Math.random() * 4000 - 2000;
					scene.add( objectCSS );

					objects.push( objectCSS );

					const object = new THREE.Object3D();
					const col = i % 20;
					const row = Math.floor( i / 20 );
					object.position.x = ( col * 150 ) - 1425;
					object.position.y = - ( row * 190 ) + 855;

					targets.table.push( object );

				}

				// sphere

				const vector = new THREE.Vector3();

				for ( let i = 0, l = objects.length; i < l; i ++ ) {

					const phi = Math.acos( - 1 + ( 2 * i ) / l );
					const theta = Math.sqrt( l * Math.PI ) * phi;

					const object = new THREE.Object3D();

					object.position.setFromSphericalCoords( 800, phi, theta );

					vector.copy( object.position ).multiplyScalar( 2 );

					object.lookAt( vector );

					targets.sphere.push( object );

				}

				// helix

				for ( let i = 0, l = objects.length; i < l; i ++ ) {

					const strand = i % 2;
					const strandIndex = Math.floor( i / 2 );
					const strandTotal = Math.ceil( l / 2 );
					const theta = ( strandIndex / strandTotal ) * Math.PI * 8 + ( strand === 1 ? Math.PI : 0 );

					const y = - ( strandIndex / strandTotal ) * 2000 + 1000;

					const object = new THREE.Object3D();

					object.position.setFromCylindricalCoords( 700, theta, y );

					vector.x = object.position.x * 2;
					vector.y = object.position.y;
					vector.z = object.position.z * 2;

					object.lookAt( vector );

					targets.helix.push( object );

				}

				// grid

				for ( let i = 0; i < objects.length; i ++ ) {

					const object = new THREE.Object3D();

					object.position.x = ( ( i % 5 ) * 400 ) - 800;
					object.position.y = ( - ( Math.floor( i / 5 ) % 4 ) * 400 ) + 600;
					object.position.z = ( Math.floor( i / 20 ) ) * 400 - 1800;

					targets.grid.push( object );

				}

				//

				renderer = new CSS3DRenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				document.getElementById( 'container' ).appendChild( renderer.domElement );

				//

				controls = new TrackballControls( camera, renderer.domElement );
				controls.minDistance = 500;
				controls.maxDistance = 6000;
				controls.addEventListener( 'change', render );

				const buttonTable = document.getElementById( 'table' );
				buttonTable.addEventListener( 'click', function () {

					transform( targets.table, 2000 );

				} );

				const buttonSphere = document.getElementById( 'sphere' );
				buttonSphere.addEventListener( 'click', function () {

					transform( targets.sphere, 2000 );

				} );

				const buttonHelix = document.getElementById( 'helix' );
				buttonHelix.addEventListener( 'click', function () {

					transform( targets.helix, 2000 );

				} );

				const buttonGrid = document.getElementById( 'grid' );
				buttonGrid.addEventListener( 'click', function () {

					transform( targets.grid, 2000 );

				} );

				transform( targets.table, 2000 );

				//

				window.addEventListener( 'resize', onWindowResize );

			}

			function transform( targets, duration ) {

				TWEEN.removeAll();

				for ( let i = 0; i < objects.length; i ++ ) {

					const object = objects[ i ];
					const target = targets[ i ];

					new TWEEN.Tween( object.position )
						.to( { x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration )
						.easing( TWEEN.Easing.Exponential.InOut )
						.start();

					new TWEEN.Tween( object.rotation )
						.to( { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration )
						.easing( TWEEN.Easing.Exponential.InOut )
						.start();

				}

				new TWEEN.Tween( this )
					.to( {}, duration * 2 )
					.onUpdate( render )
					.start();

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

				render();

			}

			function animate() {

				requestAnimationFrame( animate );

				TWEEN.update();

				controls.update();

			}

			function render() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
